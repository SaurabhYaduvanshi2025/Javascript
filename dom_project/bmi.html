<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BMI Calculator - DOM Practice</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./assets/css/output.css">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-5">

    <div class="w-full max-w-lg">

        <div class="bg-white rounded-2xl shadow-xl p-8">

            <!-- Heading -->
            <div class="text-center mb-8">

                <h1 class="text-3xl font-bold text-slate-800">
                    BMI Calculator
                </h1>

                <p class="text-slate-500 mt-2">
                    Enter your height and weight to calculate your BMI.
                </p>

            </div>


            <!-- Height -->
            <div class="mb-5">

                <label
                    for="height"
                    class="block text-sm font-semibold text-slate-700 mb-2"
                >
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    placeholder="Enter your height"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >

            </div>


            <!-- Weight -->
            <div class="mb-6">

                <label
                    for="weight"
                    class="block text-sm font-semibold text-slate-700 mb-2"
                >
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    placeholder="Enter your weight"
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"
                >

            </div>


            <!-- Buttons -->
            <div class="flex gap-3">

                <button
                    id="calculateBtn"
                    class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 active:scale-95 transition"
                >
                    Calculate BMI
                </button>

                <button
                    id="resetBtn"
                    class="flex-1 bg-slate-200 text-slate-700 py-3 rounded-lg font-semibold hover:bg-slate-300 active:scale-95 transition"
                >
                    Reset
                </button>

            </div>


            <!-- Result -->
            <div
                id="result"
                class="mt-7 p-6 bg-slate-50 rounded-xl text-center border border-slate-200"
            >

                <h2 class="text-lg font-semibold text-slate-700">
                    Your BMI
                </h2>

                <p
                    id="bmiValue"
                    class="text-4xl font-bold text-blue-600 mt-2"
                >
                    --
                </p>

                <p
                    id="bmiMessage"
                    class="mt-2"
                >
                    Enter your details to see the result.
                </p>

            </div>


            <!-- BMI Categories -->
            <div class="mt-7">

                <h3 class="text-lg font-bold text-slate-700 mb-3">
                    BMI Categories
                </h3>


                <div class="space-y-2">

                    <div
                        class="flex justify-between p-3 bg-slate-50 rounded-lg"
                    >
                        <span class="text-slate-600">
                            Underweight
                        </span>

                        <span class="font-semibold text-slate-700">
                            Below 18.5
                        </span>
                    </div>


                    <div
                        class="flex justify-between p-3 bg-slate-50 rounded-lg"
                    >
                        <span class="text-slate-600">
                            Normal
                        </span>

                        <span class="font-semibold text-slate-700">
                            18.5 - 24.9
                        </span>
                    </div>


                    <div
                        class="flex justify-between p-3 bg-slate-50 rounded-lg"
                    >
                        <span class="text-slate-600">
                            Overweight
                        </span>

                        <span class="font-semibold text-slate-700">
                            25 - 29.9
                        </span>
                    </div>



                    <div
                        class="flex justify-between p-3 bg-slate-50 rounded-lg"
                    >
                        <span class="text-slate-600">
                            Obesity
                        </span>

                        <span class="font-semibold text-slate-700">
                            30 or above
                        </span>
                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Your JavaScript -->
    <script src="./index.js"></script>

</body>
</html>
